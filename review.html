<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>ArchCAD project review</title>
    <style>
      body {
        margin: 0;
        background: #0b1220;
        color: #e2e8f0;
        font: 14px system-ui;
        padding: 20px;
      }
      main {
        max-width: 1100px;
        margin: auto;
      }
      select,
      input,
      button {
        padding: 10px;
        border: 1px solid #425773;
        border-radius: 5px;
        background: #101b2c;
        color: #e2e8f0;
        margin: 5px;
      }
      svg {
        width: 100%;
        max-height: 65vh;
        background: #101b2c;
        border: 1px solid #33445d;
      }
      #comments p {
        border-left: 3px solid #38bdf8;
        padding: 10px;
      }
      label {
        display: block;
      }
      #status {
        color: #7dd3fc;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Project review</h1>
      <p id="status">Loading shared project…</p>
      <label>Floor<select id="floor"></select></label>
      <div id="drawing"></div>
      <p>Click the drawing to anchor a comment.</p>
      <input id="comment" aria-label="Comment" placeholder="Comment" /><button
        id="post"
      >
        Post anchored comment
      </button>
      <div id="comments"></div>
    </main>
    <script src="vendor/geometry/polygon-clipping.js"></script>
    <script src="vendor/geometry/clipper.js"></script>
    <script src="js/parapet-model.js"></script><script src="js/project-model.js"></script>
    <script src="js/planning-model.js"></script>
    <script src="js/design-model.js"></script>
    <script src="js/workbench-model.js"></script>
    <script src="js/workbench-building.js"></script>
    <script src="js/review.js"></script>
    <script src="js/workbench-review.js"></script>
  </body>
</html>
